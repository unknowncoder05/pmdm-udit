location = /pmdm {
    return 308 /pmdm/;
}
location ^~ /pmdm/ {
    alias /home/ubuntu/Personal/udit/pmdm-udit/dist/;
    index index.html;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
