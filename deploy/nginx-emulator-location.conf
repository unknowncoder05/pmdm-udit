# Añadir dentro del servidor HTTPS de sandbox.yerson.co.
# El fichero de contraseñas se crea durante la instalación y no se guarda en Git.
location = /pmdm/emulador {
    return 308 /pmdm/emulador/;
}
location = /pmdm/emulador/ {
    return 302 /pmdm/emulador/vnc.html?autoconnect=true&resize=scale&path=pmdm%2Femulador%2Fwebsockify;
}
location ^~ /pmdm/emulador/ {
    auth_basic "Emulador PMDM";
    auth_basic_user_file /etc/nginx/pmdm-emulator.htpasswd;
    proxy_pass http://127.0.0.1:6084/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
